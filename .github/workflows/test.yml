name: Test

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Compileall
        run: python -m compileall -q app.py api tests
      - name: Node syntax check (extension)
        run: |
          node --check extension/popup.js
          node --check extension/offscreen.js
          node --check extension/service-worker.js
        continue-on-error: false
      - name: Validate manifest.json
        run: python -c "import json; m=json.load(open('extension/manifest.json')); assert m['manifest_version']==3"
      - name: Validate vercel.json
        run: python -c "import json; json.load(open('vercel.json'))"
      - name: Scan for leaked secrets
        run: |
          ! git grep -nE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})" || (echo "::error::疑似 secret 洩漏" && exit 1)
      - name: Scan for TODO/FIXME/HACK
        run: |
          out=$(git grep -nE "TODO|FIXME|HACK" || true)
          if [ -n "$out" ]; then echo "::warning::$out"; fi