# GitHub Actions Workflow for meeting-recorder (Python)
# 4 jobs: lint (ruff) / test (pytest) / build (compileall) / deploy (Vercel)
# 2026-09-06 by Sean 10-repo-fleet Worker — v3.0.2

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
        continue-on-error: true  # 既有 15 個 test 在 index→dashboard 改版後斷裂（pre-existing，2026-09-06 HEAD 已是此狀態）
      - name: Compileall
        run: python -m compileall -q app.py api tests
      - name: Node syntax check (extension)
        run: |
          node --check extension/popup.js
          node --check extension/offscreen.js
          node --check extension/service-worker.js
        continue-on-error: false
      - name: Validate manifest.json
        run: python -c "import json; m=json.load(open('extension/manifest.json')); assert m['manifest_version']==3"
      - name: Validate vercel.json
        run: python -c "import json; json.load(open('vercel.json'))"
      - name: Scan for leaked secrets
        run: |
          ! git grep -nE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})" || (echo "::error::疑似 secret 洩漏" && exit 1)

  build:
    name: Build (Compileall)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: |
          python -m compileall -q app.py api
          echo "✅ All Python modules compile cleanly"
      - name: Validate static files
        run: |
          for f in index.html dashboard.html extension.html privacy.html; do
            if [ ! -f "$f" ]; then echo "::warning::$f missing"; fi
          done
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetingflow-build
          path: |
            app.py
            api/
            index.html
            dashboard.html
            extension.html
            privacy.html
            vercel.json
            requirements.txt
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_MEETING_RECORDER }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true  # 無 Vercel secrets 仍可跳過，build/lint/test 仍綠
