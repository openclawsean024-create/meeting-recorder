<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MeetingFlow</title><style>*{box-sizing:border-box}body{width:340px;margin:0;padding:20px;font:14px system-ui;color:#eef2ff;background:#080b12}h1{font-size:19px;margin:0 0 4px}.muted{color:#96a0b5;line-height:1.55}.consent{display:flex;gap:9px;padding:12px;margin:15px 0;background:#111827;border:1px solid #273348;border-radius:12px}.status{padding:12px;border-radius:12px;background:#111827;margin:12px 0;color:#9ca3af}.status.live{color:#ff7a90;border:1px solid #7f1d35}button{width:100%;border:0;border-radius:12px;padding:12px;margin-top:8px;font-weight:800;cursor:pointer;background:#5eead4;color:#052e2b}button.secondary{background:#1f2937;color:#e5e7eb}button.danger{background:#fb7185;color:#3f0712}button:disabled{opacity:.45;cursor:not-allowed}.error{color:#fda4af;min-height:18px;margin-top:10px}</style></head><body><h1>MeetingFlow 錄製器</h1><div class="muted">支援 Meet、Zoom Web 與其他 Chrome 分頁。錄製期間請保持該分頁開啟。</div><label class="consent"><input id="consent" type="checkbox"><span>我已告知所有與會者，並取得錄音同意。</span></label><div id="status" class="status">尚未開始錄製</div><button id="start" disabled>開始錄製目前分頁</button><button id="stop" class="danger" hidden>停止並下載</button><button id="open" class="secondary">開啟 MeetingFlow 工作台</button><button id="clear" class="secondary">清除外掛內的錄音</button><div id="error" class="error"></div><script src="popup.js"></script></body></html>
